name: Publish Node client to npm

# Publishes the node/ package (viaduct-sh) to npm when a version tag (v*) is
# pushed. Uses npm Trusted Publishing (OIDC): no token stored in the repo.
# One-time setup on npmjs.com: on the viaduct-sh package -> Settings -> Trusted
# Publisher, add GitHub Actions with repository "webmull/viaduct" and workflow
# "publish-npm.yml". The package must already exist (do the first publish
# locally with `npm publish`), since the trusted publisher lives on the package.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing needs npm >= 11.5.1; pin it (npm@latest now
      # requires Node 22+, which would EBADENGINE on this Node 20 runner).
      - run: npm install -g npm@11.5.1
      - run: npm publish --access public
