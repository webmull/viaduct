[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viaduct"
version = "0.8.2"
description = "Self-hosted reverse tunnel: expose a local service at a public HTTPS hostname"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
viaduct = "viaduct.client:main"
viaductd = "viaduct.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/viaduct"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
