<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14171f" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" sizes="32x32" href="/favicon-32.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#f5b544" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
  <link rel="stylesheet" href="/styles.css" />
  <title>Page not found: viaduct.sh</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <div id="site-header"></div>
  <script src="/header.js"></script>

  <main>
    <section class="hero" style="min-height:58vh;display:grid;place-items:center">
      <div class="wrap">
        <p class="eyebrow">Error</p>
        <div style="font-family:var(--font-display);font-weight:700;font-size:clamp(4.5rem,16vw,8rem);line-height:1;color:var(--primary);font-variant-numeric:tabular-nums">404</div>
        <h1 style="font-size:clamp(1.6rem,4vw,2.4rem);margin-top:0.6rem">Page not found</h1>
        <p class="lede">That page does not exist or has moved. Head back to the homepage, or read the getting-started guide.</p>
        <div class="actions" style="justify-content:center">
          <a class="btn btn-primary" href="/">Home</a>
          <a class="btn btn-outline" href="/docs/">Read the docs</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a href="https://adamdavis.co.uk" target="_blank" rel="noreferrer"
         style="display:flex;align-items:center;gap:0.6rem;text-decoration:none;color:inherit">
        <img src="/adam.png" alt="Adam Davis" width="34" height="34" style="border-radius:999px;border:1px solid var(--border-strong)" />
        <span>Built by <strong style="color:var(--foreground);font-weight:600">Adam Davis</strong></span>
      </a>
      <div class="footer-links">
        <a href="https://github.com/webmull/viaduct" target="_blank" rel="noreferrer">GitHub</a>
        <a href="/network/">Network</a>
        <a href="/docs/">Docs</a>
        <a href="/news/">News</a>
        <a href="/terms/">Fair use</a>
        <a href="https://github.com/webmull/viaduct/blob/main/LICENSE" target="_blank" rel="noreferrer">MIT License</a>
      </div>
    </div>
  </footer>
  <script src="/nav-toggle.js" defer></script>
  <script src="/to-top.js" defer></script>
</body>
</html>
